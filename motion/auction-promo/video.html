<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="brand/brand.css">
  <script src="plan.js"></script>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0054fd;font-family:var(--font);color:var(--ink)}
    #app{position:absolute;width:1600px;height:900px;left:50%;top:50%;transform-origin:center;overflow:hidden;background:#0054fd}
    .rays,.bubble{display:none}
    .bubble.a{width:250px;height:250px;right:100px;top:-90px}.bubble.b{width:120px;height:120px;left:130px;bottom:-45px}.bubble.c{width:52px;height:52px;right:290px;bottom:110px}
    .phone{position:absolute;left:50%;top:calc(50% + 100px);width:548px;height:810px;padding:10px;border:2px solid #73849a;border-radius:62px;background:linear-gradient(105deg,#06162d 0%,#1b3859 16%,#071d3a 45%,#345879 78%,#06162d 100%);box-shadow:0 46px 90px #041d3f57,0 8px 0 #021127;transform:translate(-50%,-50%);overflow:visible}
    .phone:before{content:"";position:absolute;z-index:-1;left:-7px;top:155px;width:7px;height:78px;border-radius:4px 0 0 4px;background:linear-gradient(#597087,#1b3047);box-shadow:0 97px 0 #1b3047,555px 65px 0 #203c57}
    .phone:after{content:"";position:absolute;inset:4px 19px 4px auto;width:17px;border-radius:30px;background:linear-gradient(115deg,transparent 6%,#ffffff22 20%,transparent 46%);pointer-events:none}
    .screen{height:100%;border:1px solid #000;border-radius:51px;background:#e6f0ff;overflow:hidden;position:relative}
    .status{height:54px;padding:16px 27px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:700}.island{position:absolute;top:8px;left:50%;width:120px;height:31px;transform:translateX(-50%);border-radius:20px;background:#041d3f}.dots{letter-spacing:2px;font-size:13px}
    .header{height:70px;padding:0 25px;display:flex;align-items:center;justify-content:space-between}.header img{width:99px}.header span{font-size:13px;color:#31547f;font-weight:600}
    .shell{height:calc(100% - 124px);padding:13px 23px 37px;position:relative}.eyebrow{font-size:11px;color:#31547f;font-weight:700;letter-spacing:.2px;margin:0 4px 11px}.card,.apartment{border:1px solid #d9e4ff;background:#fff;box-shadow:0 14px 30px #041d3f12}.card{border-radius:17px;padding:21px 18px 18px;margin-top:15px}.apartment{border-radius:16px;overflow:hidden;display:grid;grid-template-columns:142px 1fr;min-height:140px}
    .photo{position:relative;overflow:hidden;background:#d7e9f7}.photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff2,transparent 42%);pointer-events:none}
    .apartment-copy{padding:17px 15px}.apartment h2{margin:0;font-size:17px;line-height:22px}.apartment p,.apartment small{display:block;margin:6px 0 0;color:#31547f;font-size:12px;line-height:16px}
    .badge{display:inline-flex;align-items:center;min-height:24px;padding:4px 9px;border-radius:999px;background:#e9f2ff;color:#0054fd;font-size:12px;font-weight:700}.badge.ok{background:#def6e6;color:#208144}.badge.neutral{background:#edf1f6;color:#526d8d}
    h1{font-size:28px;line-height:33px;letter-spacing:-.65px;margin:12px 0 10px} .lead{font-size:14px;line-height:20px;color:#31547f;margin:0}.roles{display:grid;gap:10px;margin-top:20px}.role{border:1px solid #d6e2ff;border-radius:13px;background:#f7faff;padding:15px;display:grid;grid-template-columns:27px 1fr 14px;gap:11px;align-items:center}.role.buyer{background:#eef4ff}.role .icon{font-size:21px;color:#0054fd}.role strong{font-size:14px;display:block}.role small{display:block;color:#31547f;font-size:11px;line-height:15px;margin-top:3px}.arrow{color:#31547f;font-size:20px}
    .benefits{display:grid;gap:9px;margin:18px 0;color:#31547f;font-size:12px;font-weight:600}.benefits span:before{content:"✓";color:#168043;margin-right:8px}.primary{height:48px;border:0;border-radius:10px;width:100%;background:#0054fd;color:#fff;font-family:var(--font);font-weight:700;font-size:15px;box-shadow:0 8px 16px #0054fd32}.fields{display:grid;gap:10px;margin:16px 0}.field{border:1px solid #b9cdfd;border-radius:10px;background:#fff;padding:9px 12px}.field label{display:block;color:#31547f;font-size:11px;margin-bottom:4px}.field b{font-size:15px}.field small{display:block;margin-top:3px;color:#7389a8;font-size:10px}.review{display:grid;gap:10px;margin:15px 0}.review span{display:flex;justify-content:space-between;color:#31547f;font-size:13px}.review b{color:#041d3f}.private{display:flex;gap:7px;border-radius:10px;background:#eef4ff;padding:10px;color:#31547f;font-size:11px;line-height:15px;margin:14px 0}.private:before{content:"i";display:grid;place-items:center;flex:0 0 16px;height:16px;border:1.5px solid #31547f;border-radius:50%;font-weight:700}
    .momentum{margin:14px 0;padding:10px 11px;border-radius:11px;background:#eef4ff;display:flex;gap:10px;align-items:center;color:#31547f}.momentum i{font-style:normal;font-size:20px}.momentum strong,.momentum small{display:block}.momentum strong{font-size:12px;color:#041d3f}.momentum small{font-size:10px;margin-top:3px}.summary{display:grid;grid-template-columns:1.4fr 1fr;gap:1px;border:1px solid #d9e4ff;overflow:hidden;border-radius:12px;background:#d9e4ff}.summary div{padding:10px;background:#fff}.summary span{display:block;color:#31547f;font-size:10px}.summary b{display:block;font-size:15px;margin-top:4px}.summary .wide{grid-column:span 2}.summary .wide b{color:#168043}.bid{margin-top:14px;border:1px solid #b9cdfd;border-radius:10px;background:#fff;padding:10px 12px}.bid label{display:block;font-size:11px;color:#31547f}.bid b{display:block;margin-top:5px;font-size:17px}.bid small{color:#7389a8;font-size:10px}.success{margin:14px 0 0;padding:12px;border-radius:12px;background:#e3f6e9;display:flex;gap:9px}.success .check{width:21px;height:21px;display:grid;place-items:center;border-radius:50%;background:#2c9a52;color:#fff;font-weight:700}.success strong{font-size:13px;display:block;color:#126b32}.success p{font-size:11px;color:#20733d;line-height:15px;margin:3px 0 0}
    .touch-ring{position:absolute;width:48px;height:48px;border:2px solid #0054fd;border-radius:50%;z-index:19;pointer-events:none;background:#ffffffbf;box-shadow:0 0 0 7px #0054fd24,0 3px 10px #041d3f2b;transform-origin:center}
    .transition{position:absolute;z-index:25;left:50%;top:50%;width:520px;height:520px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#0054fd 0 15%,#fff 15% 31%,#f7b718 31% 48%,#ff641a 48% 67%,#0054fd 67%);transform-origin:center;pointer-events:none}.transition img{width:96px;height:96px}
    .final{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;text-align:center;z-index:30}.final-copy{width:100%;transform:translateY(-2px)}.final-copy strong{display:block;color:#0054fd;font-size:72px;line-height:1;letter-spacing:-2.6px}.final-copy p{font-size:30px;color:#041d3f;margin:26px 0 0}
  </style>
</head>
<body>
  <main id="app">
    <section class="phone" id="phone"><div class="screen"><div class="status"><span>9:41</span><span class="dots">● ● ●</span></div><i class="island"></i><header class="header"><img src="brand/logos/wordmark.svg" alt="Циан"><span>Аукцион</span></header><div class="shell" id="content"></div></div></section>
    <div class="touch-ring" id="touchRing"></div>
    <section class="transition" id="transition"><img id="transitionMark" src="assets/cian-mark-circle.png" alt="Знак Циана"></section>
    <section class="final" id="final"><div class="final-copy"><strong>Циан Аукцион.</strong><p>Задайте условия и запустите торги</p></div></section>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const app = $('#app'), content = $('#content'), phone = $('#phone'), touchRing = $('#touchRing'), transition = $('#transition'), transitionMark = $('#transitionMark'), final = $('#final');
    const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
    const ease = (v) => {v=clamp(v);return v*v*(3-2*v)};
    const between = (t,a,b) => ease((t-a)/(b-a));
    const tap = (t,a,b) => Math.sin(Math.PI*clamp((t-a)/(b-a)));
    const setTouch = (x,y,visible=1,press=0) => {touchRing.style.left=(x-24)+'px';touchRing.style.top=(y-24)+'px';touchRing.style.opacity=visible;touchRing.style.transform='scale('+(1-press*.12)+')';};
    const setTouchAt = (selector,visible=1,press=0) => { if(!selector || visible<=0){setTouch(0,0,0);return;} const el=content.querySelector(selector); if(!el){setTouch(0,0,0);return;} const r=el.getBoundingClientRect(), a=app.getBoundingClientRect(), sc=Math.min(innerWidth/1600,innerHeight/900); setTouch((r.left+r.width/2-a.left)/sc,(r.top+r.height/2-a.top)/sc,visible,press); };
    const card = (inside) => '<div class="eyebrow">Демонстрационный прототип</div>'+inside;
    const apartment = '<article class="apartment"><div class="photo"><img src="assets/apartment-exterior.jpg" alt="Фасад современного жилого дома"></div><div class="apartment-copy"><h2>2-комн. квартира, 58,4 м²</h2><p>Москва, ул. Большая Черёмушкинская, 19</p><small>8 этаж из 17 · 8 мин. до метро</small></div></article>';
    function choice(){return card('<section class="card"><span class="badge">Продажа на аукционе</span><h1>Как вы участвуете?</h1><p class="lead">Выберите роль, чтобы пройти один законченный сценарий.</p><div class="roles"><div class="role"><span class="icon">⌂</span><span><strong>Я продаю квартиру</strong><small>Задам условия и запущу торги за несколько минут</small></span><b class="arrow">›</b></div><div class="role buyer"><span class="icon">♙</span><span><strong>Я хочу купить</strong><small>Посмотрю лот, условия и сделаю ставку</small></span><b class="arrow">›</b></div></div></section>')}
    function seller(){return card(apartment+'<section class="card"><span class="badge">Ваша квартира</span><h1>Пусть квартира найдёт лучшую цену</h1><p class="lead">Вы сами задаёте условия, а покупатели делают ставки.</p><div class="benefits"><span>Условия под вашим контролем</span><span>Публикация займёт около 3 минут</span></div><button class="primary">Задать условия аукциона</button></section>')}
    const typed = (value,start,end,t) => value.slice(0,Math.ceil(value.length*between(t,start,end)));
    function form(t){const start=typed('14 500 000',3.9,4.27,t), step=typed('100 000',4.28,4.55,t), ends=typed('26 ноября, 19:00',4.56,4.9,t), reserve=typed('15 000 000',4.91,5.22,t);return card(apartment+'<section class="card"><h1>Условия аукциона</h1><p class="lead">Укажите условия, которые увидят покупатели.</p><div class="fields"><div class="field"><label>Стартовая цена, ₽</label><b>'+ (start||' ') +'</b></div><div class="field"><label>Минимальный шаг ставки, ₽</label><b>'+ (step||' ') +'</b></div><div class="field"><label>Аукцион завершится</label><b>'+ (ends||' ') +'</b></div><div class="field"><label>Резервная цена, ₽</label><b>'+ (reserve||' ') +'</b><small>Эту сумму увидите только вы</small></div></div><button class="primary form-action">Проверить условия</button></section>')}
    function review(){return card(apartment+'<section class="card"><span class="badge">Проверьте перед публикацией</span><h1>Всё готово к аукциону</h1><div class="review"><span>Стартовая цена <b>14 500 000 ₽</b></span><span>Минимальный шаг <b>100 000 ₽</b></span><span>Завершение <b>26 ноября, 19:00</b></span><span>Резервная цена <b>15 000 000 ₽</b></span></div><p class="private">Резервная цена не будет видна покупателям.</p><button class="primary">Опубликовать аукцион</button></section>')}
    function buyer(ok=false,t=0){const bid=typed('14 600 000',8.22,8.78,t);return card(apartment+'<section class="card"><span class="badge">Аукцион открыт</span><h1>Ваша ставка может стать лучшей</h1><div class="momentum"><i>◷</i><span><strong>Торги завершатся 26 ноября, 19:00</strong><small>Успейте оставить ставку до окончания аукциона</small></span></div><div class="summary"><div><span>Текущая ставка</span><b>'+ (ok?'14 600 000 ₽':'14 500 000 ₽') +'</b></div><div><span>Минимальный шаг</span><b>100 000 ₽</b></div><div class="wide"><span>Ставок</span><b>'+ (ok?'1':'0') +'</b></div></div>'+ (ok?'<div class="success"><span class="check">✓</span><span><strong>Ставка принята</strong><p>Сейчас вы лидируете. Мы сообщим, если ставку перебьют.</p></span></div>':'<div class="bid"><label>Ваша ставка, ₽</label><b>'+ (bid||' ') +'</b><small>Не меньше 14 600 000 ₽</small></div><button class="primary" style="margin-top:11px">Сделать ставку</button>') +'</section>')}
    let last=''; function put(key,html){if(key!==last || key==='form' || key==='buyer'){content.innerHTML=html;last=key}}
    function render(t){
      const scale=Math.min(innerWidth/1600,innerHeight/900); app.style.transform='translate(-50%,-50%) scale('+scale+')';
      let key='choice', html=choice(), target='.role', cv=1, press=tap(t,1.45,1.78), zoom=1, scroll=0;
      if(t<1.8){key='choice';html=choice();target='.role';press=tap(t,1.45,1.78);}
      else if(t<3.8){key='seller';html=seller();target='.primary';press=tap(t,3.2,3.7);zoom=1.01;}
      else if(t<5.8){key='form';html=form(t);target='.form-action';press=tap(t,5.43,5.75);cv=between(t,5.05,5.38);scroll=118*between(t,5.08,5.5);zoom=1.025;}
      else if(t<7.8){key='review';html=review();target='.primary';press=tap(t,6.95,7.6);zoom=1.03;}
      else if(t<10.0){key='buyer';html=buyer(false,t);target='.primary';press=tap(t,9.2,9.8);cv=between(t,8.86,9.12);scroll=126*between(t,8.82,9.18);zoom=1.02;}
      else {key='accepted';html=buyer(true,t);target='';cv=0;zoom=1.035;}
      const exit=between(t,11.45,12.25);
      put(key,html); content.style.transform='translateY(-'+scroll+'px)';phone.style.transform='translate(-50%,-50%) translateY('+(exit*850)+'px) scale('+zoom+')';setTouchAt(target,cv*(1-exit),press);
      const tp=between(t,12.18,13.42), active=t>=12.05&&t<13.55;
      transition.style.opacity=active?1:0;transition.style.transform='translate(-50%,-50%) scale('+(0.13+tp*4.8)+')';transitionMark.style.opacity=1-between(t,12.8,13.28);transitionMark.style.transform='scale('+(1-between(t,12.2,13.28)*.8)+')';
      const fp=between(t,13.32,13.72);final.style.opacity=fp;final.style.transform='none';
    }
    window.DURATION=window.PLAN.duration;window.FPS=window.PLAN.fps;window.render=render;
    const apartmentImage = new Image(); apartmentImage.src = 'assets/apartment-exterior.jpg';
    Promise.all([document.fonts.ready, apartmentImage.decode().catch(() => {})]).then(()=>{render(0);window.READY=true});
  </script>
</body>
</html>
